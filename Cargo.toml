[workspace]
members = ["preproc", "renderer"]
resolver = "3"

# Note that we indirectly depend on `idna`, and that can pull in a *ton* of dependencies;
# this is currently avoided by turning off IDNA support *entirely*,
# which notably means that our renderer rejects non-ASCII domain names
# and fails to properly enforce Punycode domains.
# This should be fine for us, but here is the documentation if this needs to be changed in the future:
# https://docs.rs/crate/idna_adapter/latest

[workspace.dependencies.tracing]
version = "0.1"
# Disable `#[instrument]` since we don't use it.
default-features = false
features = ["std"]

[workspace.dependencies.regex]
version = "1.13"
# Disable Unicode support to reduce our deps.
default-features = false
features = ["std", "perf"]

[workspace.dependencies.tracing-subscriber]
version = "0.3"
# We don't use `log`.
default-features = false
features = ["std", "fmt", "ansi", "smallvec"]
